<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neuralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0080ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8000ff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  
  <!-- Neural Network Nodes -->
  <circle cx="8" cy="8" r="2" fill="url(#neuralGradient)"/>
  <circle cx="24" cy="8" r="2" fill="url(#neuralGradient)"/>
  <circle cx="8" cy="24" r="2" fill="url(#neuralGradient)"/>
  <circle cx="24" cy="24" r="2" fill="url(#neuralGradient)"/>
  <circle cx="16" cy="16" r="3" fill="url(#neuralGradient)"/>
  
  <!-- Neural Connections -->
  <line x1="8" y1="8" x2="16" y2="16" stroke="#00ff41" stroke-width="1" opacity="0.7"/>
  <line x1="24" y1="8" x2="16" y2="16" stroke="#0080ff" stroke-width="1" opacity="0.7"/>
  <line x1="8" y1="24" x2="16" y2="16" stroke="#8000ff" stroke-width="1" opacity="0.7"/>
  <line x1="24" y1="24" x2="16" y2="16" stroke="#ff0080" stroke-width="1" opacity="0.7"/>
  
  <!-- Border glow effect -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="url(#neuralGradient)" stroke-width="1" opacity="0.5"/>
</svg>
